# Configuration Netlify pour le site Ets Mezine
# Le site est dans livrables/ets-mezine/site-web/code/

[build]
  publish = "livrables/ets-mezine/site-web/code"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"