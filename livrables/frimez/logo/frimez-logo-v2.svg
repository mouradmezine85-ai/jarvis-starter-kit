<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Oval frame gradient: deep blue top-left -> bright red bottom-right -->
    <linearGradient id="ovalGrad" x1="0.1" y1="0.1" x2="0.95" y2="0.9">
      <stop offset="0%" stop-color="#1E4FD9"/>
      <stop offset="35%" stop-color="#1942B8"/>
      <stop offset="55%" stop-color="#8B2A5C"/>
      <stop offset="75%" stop-color="#D7262B"/>
      <stop offset="100%" stop-color="#B51C21"/>
    </linearGradient>

    <!-- Oval highlight overlay (chrome shine on top edge) -->
    <linearGradient id="ovalShine" x1="0.3" y1="0" x2="0.5" y2="0.4">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Letters gradient: blue -> dark navy -> red (matches reference) -->
    <linearGradient id="letterGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2A66E6"/>
      <stop offset="25%" stop-color="#1A3D9E"/>
      <stop offset="50%" stop-color="#0F2A6E"/>
      <stop offset="75%" stop-color="#8E1E2E"/>
      <stop offset="100%" stop-color="#D7262B"/>
    </linearGradient>

    <!-- Letter top-highlight (shine) -->
    <linearGradient id="letterShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Mercury gradient -->
    <linearGradient id="mercuryGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#9A0F17"/>
      <stop offset="50%" stop-color="#D7262B"/>
      <stop offset="100%" stop-color="#F04A50"/>
    </linearGradient>

    <!-- Bulb radial gradient (glossy) -->
    <radialGradient id="bulbGrad" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0%" stop-color="#FF8085"/>
      <stop offset="40%" stop-color="#D7262B"/>
      <stop offset="100%" stop-color="#7A0F14"/>
    </radialGradient>

    <!-- Soft drop shadow for whole logo -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Inner glow for oval -->
    <filter id="ovalInnerShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shadowDiff"/></feMerge>
    </filter>

    <style>
      .wordmark {
        font-family: "Impact", "Arial Black", "Helvetica Neue", sans-serif;
        font-weight: 900;
        font-size: 320px;
        letter-spacing: 4px;
      }
    </style>

    <!-- Clip path matching the wordmark shape for the shine overlay -->
    <clipPath id="letterClipLeft">
      <text x="750" y="560" class="wordmark" text-anchor="end" transform="skewX(-10) translate(80,0)">FR</text>
    </clipPath>
    <clipPath id="letterClipRight">
      <text x="860" y="560" class="wordmark" transform="skewX(-10) translate(80,0)">MEZ</text>
    </clipPath>
  </defs>

  <!-- OVAL FRAME: outer stroke with gradient -->
  <g filter="url(#softShadow)">
    <!-- Outer oval shadow base -->
    <ellipse cx="800" cy="470" rx="720" ry="320" fill="none"
             stroke="url(#ovalGrad)" stroke-width="42"/>
    <!-- Inner subtle white separator -->
    <ellipse cx="800" cy="470" rx="700" ry="300" fill="none"
             stroke="#FFFFFF" stroke-width="4" opacity="0.9"/>
    <!-- Chrome shine on top-left of oval -->
    <ellipse cx="800" cy="470" rx="720" ry="320" fill="none"
             stroke="url(#ovalShine)" stroke-width="42"/>
  </g>

  <!-- WORDMARK: left side "FR" with italic skew and gradient -->
  <g transform="translate(0, 0)" filter="url(#softShadow)">
    <!-- Dark base layer for 3D depth (offset down-right) -->
    <text x="754" y="564" class="wordmark" text-anchor="end"
          transform="skewX(-10) translate(80,0)" fill="#0A1A3E" opacity="0.6">FR</text>
    <!-- Main gradient letters -->
    <text x="750" y="560" class="wordmark" text-anchor="end"
          transform="skewX(-10) translate(80,0)" fill="url(#letterGrad)">FR</text>
    <!-- Top shine overlay (clipped to letter shape) -->
    <rect x="200" y="310" width="700" height="130" fill="url(#letterShine)" clip-path="url(#letterClipLeft)"/>
    <!-- Outer thin dark stroke for crispness -->
    <text x="750" y="560" class="wordmark" text-anchor="end"
          transform="skewX(-10) translate(80,0)" fill="none"
          stroke="#0A1A3E" stroke-width="3">FR</text>
  </g>

  <!-- THERMOMETER replacing "I" between R and M -->
  <g transform="translate(770, 290)" filter="url(#softShadow)">
    <!-- Outer dark glass tube -->
    <rect x="0" y="0" width="56" height="240" rx="28" ry="28"
          fill="#F5F7FA" stroke="#0F2A6E" stroke-width="7"/>
    <!-- Mercury column (fills ~75%) -->
    <rect x="12" y="70" width="32" height="170" fill="url(#mercuryGrad)"/>
    <!-- Scale marks on the right -->
    <g stroke="#0F2A6E" stroke-width="4" stroke-linecap="round">
      <line x1="46" y1="55" x2="60" y2="55"/>
      <line x1="46" y1="90" x2="54" y2="90"/>
      <line x1="46" y1="125" x2="60" y2="125"/>
      <line x1="46" y1="160" x2="54" y2="160"/>
      <line x1="46" y1="195" x2="60" y2="195"/>
    </g>
    <!-- Glass highlight (left side of tube) -->
    <rect x="6" y="20" width="8" height="200" rx="4" fill="#FFFFFF" opacity="0.65"/>
    <!-- Bulb (glossy sphere) -->
    <circle cx="28" cy="265" r="52" fill="url(#bulbGrad)" stroke="#0F2A6E" stroke-width="7"/>
    <!-- Bulb highlight -->
    <ellipse cx="15" cy="248" rx="12" ry="18" fill="#FFFFFF" opacity="0.55"/>
    <!-- Top cap -->
    <circle cx="28" cy="8" r="10" fill="#0F2A6E"/>
  </g>

  <!-- WORDMARK: right side "MEZ" with italic skew and gradient -->
  <g filter="url(#softShadow)">
    <!-- Dark base layer for 3D depth -->
    <text x="864" y="564" class="wordmark"
          transform="skewX(-10) translate(80,0)" fill="#5B0A10" opacity="0.6">MEZ</text>
    <!-- Main gradient letters -->
    <text x="860" y="560" class="wordmark"
          transform="skewX(-10) translate(80,0)" fill="url(#letterGrad)">MEZ</text>
    <!-- Top shine overlay -->
    <rect x="860" y="310" width="700" height="130" fill="url(#letterShine)" clip-path="url(#letterClipRight)"/>
    <!-- Outer thin dark stroke -->
    <text x="860" y="560" class="wordmark"
          transform="skewX(-10) translate(80,0)" fill="none"
          stroke="#0A1A3E" stroke-width="3">MEZ</text>
  </g>
</svg>
