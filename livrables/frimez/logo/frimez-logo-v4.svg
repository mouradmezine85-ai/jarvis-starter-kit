<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Dégradé ovale : bleu marine -> bleu électrique | rouge vif -> rouge foncé -->
    <linearGradient id="ovalGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0A1F6E"/>
      <stop offset="35%"  stop-color="#1E66FF"/>
      <stop offset="50%"  stop-color="#5A3380"/>
      <stop offset="65%"  stop-color="#FF2338"/>
      <stop offset="100%" stop-color="#7A0010"/>
    </linearGradient>

    <!-- Dégradé texte bleu (gauche) -->
    <linearGradient id="blueText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2E8CFF"/>
      <stop offset="55%"  stop-color="#0E3BC8"/>
      <stop offset="100%" stop-color="#061A6E"/>
    </linearGradient>

    <!-- Dégradé texte rouge (droite) -->
    <linearGradient id="redText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FF4458"/>
      <stop offset="55%"  stop-color="#D80E22"/>
      <stop offset="100%" stop-color="#6A0008"/>
    </linearGradient>

    <!-- Dégradé thermomètre bleu(haut)->rouge(bas) -->
    <linearGradient id="thermoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2E8CFF"/>
      <stop offset="35%"  stop-color="#0E3BC8"/>
      <stop offset="55%"  stop-color="#7A1A4A"/>
      <stop offset="75%"  stop-color="#D80E22"/>
      <stop offset="100%" stop-color="#B00018"/>
    </linearGradient>

    <!-- Verre thermomètre -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Ombre portée douce -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="4" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Léger relief -->
    <filter id="emboss" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="4" specularConstant="0.7"
                          specularExponent="22" lighting-color="#ffffff" result="spec">
        <feDistantLight azimuth="235" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOut"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="specOut"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond blanc pur -->
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- OVALE DYNAMIQUE -->
  <g transform="rotate(-6 800 450)" filter="url(#softShadow)">
    <!-- Trait principal épais -->
    <ellipse cx="800" cy="450" rx="690" ry="245"
             fill="none" stroke="url(#ovalGrad)" stroke-width="22" stroke-linecap="round"/>
    <!-- Trait fin accompagnateur (effet vitesse) -->
    <ellipse cx="800" cy="450" rx="660" ry="220"
             fill="none" stroke="url(#ovalGrad)" stroke-width="4" opacity="0.55"/>
    <!-- Micro-trait extérieur -->
    <ellipse cx="800" cy="450" rx="720" ry="268"
             fill="none" stroke="url(#ovalGrad)" stroke-width="2" opacity="0.35"/>
  </g>

  <!-- TEXTE FRIMEZ : FR (bleu) + thermomètre (I) + MEZ (rouge) -->
  <g transform="translate(800 490)" filter="url(#softShadow)">
    <g transform="skewX(-10)">
      <!-- Partie BLEUE : F R -->
      <text x="-50" y="0"
            text-anchor="end"
            font-family="Impact, 'Haettenschweiler', 'Arial Narrow Bold', 'Arial Black', sans-serif"
            font-weight="900"
            font-size="340"
            letter-spacing="-6"
            fill="url(#blueText)"
            stroke="#061A6E"
            stroke-width="5"
            paint-order="stroke fill"
            filter="url(#emboss)">FR</text>

      <!-- Partie ROUGE : M E Z -->
      <text x="50" y="0"
            text-anchor="start"
            font-family="Impact, 'Haettenschweiler', 'Arial Narrow Bold', 'Arial Black', sans-serif"
            font-weight="900"
            font-size="340"
            letter-spacing="-6"
            fill="url(#redText)"
            stroke="#6A0008"
            stroke-width="5"
            paint-order="stroke fill"
            filter="url(#emboss)">MEZ</text>
    </g>
  </g>

  <!-- THERMOMÈTRE (remplace le I) -->
  <g transform="translate(800 405)" filter="url(#softShadow)">
    <g transform="skewX(-10)">
      <!-- Verre extérieur (colonne) -->
      <rect x="-35" y="-230" width="70" height="330" rx="35" ry="35"
            fill="#ffffff" stroke="#111111" stroke-width="7"/>
      <!-- Verre extérieur (réservoir rond) -->
      <circle cx="0" cy="140" r="68" fill="#ffffff" stroke="#111111" stroke-width="7"/>
      <!-- Connecteur colonne-réservoir caché derrière -->
      <rect x="-28" y="80" width="56" height="40" fill="#ffffff"/>

      <!-- Liquide colonne (dégradé) -->
      <rect x="-20" y="-210" width="40" height="330" rx="20" ry="20"
            fill="url(#thermoGrad)"/>
      <!-- Liquide réservoir -->
      <circle cx="0" cy="140" r="52" fill="url(#thermoGrad)"/>
      <!-- Fusion liquide colonne-réservoir -->
      <rect x="-18" y="100" width="36" height="45" fill="url(#thermoGrad)"/>

      <!-- Graduations -->
      <g stroke="#111111" stroke-width="4" stroke-linecap="round" fill="none">
        <line x1="22" y1="-170" x2="40" y2="-170"/>
        <line x1="22" y1="-110" x2="34" y2="-110"/>
        <line x1="22" y1="-50"  x2="40" y2="-50"/>
        <line x1="22" y1="10"   x2="34" y2="10"/>
        <line x1="22" y1="70"   x2="40" y2="70"/>
      </g>

      <!-- Reflet verre colonne -->
      <rect x="-28" y="-220" width="10" height="300" rx="5"
            fill="#ffffff" opacity="0.55"/>
      <!-- Reflet réservoir -->
      <ellipse cx="-20" cy="120" rx="14" ry="22" fill="#ffffff" opacity="0.5"/>

      <!-- Petit cap/bouchon haut -->
      <rect x="-30" y="-250" width="60" height="24" rx="6"
            fill="#2a2a2a" stroke="#111111" stroke-width="3"/>
    </g>
  </g>
</svg>
