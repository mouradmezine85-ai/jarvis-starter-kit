<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="mercury" x1="0" x2="0" y1="1" y2="0">
      <stop offset="0%" stop-color="#C1121F"/>
      <stop offset="100%" stop-color="#E63946"/>
    </linearGradient>
    <style>
      .wordmark {
        font-family: "Impact", "Arial Black", "Helvetica Neue", sans-serif;
        font-weight: 900;
        font-size: 220px;
        letter-spacing: 2px;
        fill: #0A2540;
      }
    </style>
  </defs>

  <!-- Left letters: FR -->
  <text x="570" y="285" class="wordmark" text-anchor="end">FR</text>

  <!-- Thermometer replacing the "I", centered at x=600 -->
  <g transform="translate(582, 95)">
    <!-- Glass tube outline -->
    <rect x="0" y="0" width="36" height="170" rx="18" ry="18"
          fill="none" stroke="#0A2540" stroke-width="9"/>
    <!-- Bulb outline -->
    <circle cx="18" cy="178" r="34"
            fill="none" stroke="#0A2540" stroke-width="9"/>
    <!-- Mercury inside tube -->
    <rect x="9" y="50" width="18" height="128" fill="url(#mercury)"/>
    <!-- Mercury in bulb -->
    <circle cx="18" cy="178" r="26" fill="url(#mercury)"/>
    <!-- Top cap dot -->
    <circle cx="18" cy="10" r="5" fill="#0A2540"/>
  </g>

  <!-- Right letters: MEZ -->
  <text x="640" y="285" class="wordmark">MEZ</text>

  <!-- Subtle red underline accent -->
  <rect x="200" y="325" width="800" height="10" rx="5" fill="#E63946"/>
</svg>
