<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Oval LEFT half: blue electric -> blue marine (depth, same color family) -->
    <linearGradient id="ovalLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#087CE8"/>
      <stop offset="100%" stop-color="#003B73"/>
    </linearGradient>
    <!-- Oval RIGHT half: bright red -> dark red -->
    <linearGradient id="ovalRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E52323"/>
      <stop offset="100%" stop-color="#9A0F17"/>
    </linearGradient>

    <!-- Oval top shine -->
    <linearGradient id="ovalShine" x1="0.2" y1="0" x2="0.5" y2="0.5">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Letters LEFT (F, R): blue electric top -> blue marine bottom -->
    <linearGradient id="letterBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A8CFF"/>
      <stop offset="50%" stop-color="#087CE8"/>
      <stop offset="100%" stop-color="#003B73"/>
    </linearGradient>
    <!-- Letters RIGHT (M, E, Z): bright red top -> dark red bottom -->
    <linearGradient id="letterRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF4040"/>
      <stop offset="50%" stop-color="#E52323"/>
      <stop offset="100%" stop-color="#9A0F17"/>
    </linearGradient>

    <!-- Shine overlay for letters -->
    <linearGradient id="letterShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Mercury (red hot, upper part) -->
    <linearGradient id="mercuryHot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#9A0F17"/>
      <stop offset="100%" stop-color="#FF4040"/>
    </linearGradient>
    <!-- Mercury (blue cold, lower part) -->
    <linearGradient id="mercuryCold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A8CFF"/>
      <stop offset="100%" stop-color="#003B73"/>
    </linearGradient>

    <!-- Bulb half-blue (gradient radial, glossy) -->
    <radialGradient id="bulbBlue" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0%" stop-color="#80BFFF"/>
      <stop offset="45%" stop-color="#087CE8"/>
      <stop offset="100%" stop-color="#002451"/>
    </radialGradient>

    <!-- Soft shadow filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="7" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&amp;display=swap');
      .wm {
        font-family: 'Barlow Condensed', 'Impact', 'Arial Black', sans-serif;
        font-weight: 900;
        font-size: 340px;
        letter-spacing: 0;
      }
    </style>

    <!-- Clip paths for shine over letters -->
    <clipPath id="clipLeftLetters">
      <text x="760" y="580" class="wm" text-anchor="end" transform="skewX(-10) translate(90,0)">FR</text>
    </clipPath>
    <clipPath id="clipRightLetters">
      <text x="860" y="580" class="wm" transform="skewX(-10) translate(90,0)">MEZ</text>
    </clipPath>

    <!-- Half-ellipse paths: left blue arc, right red arc, meeting at top center and bottom center -->
    <!-- Oval center: (800, 480), rx=680, ry=300 -->
    <!-- Top point: (800, 180), Bottom point: (800, 780) -->
  </defs>

  <!-- OVAL FRAME: left blue half -->
  <g filter="url(#softShadow)">
    <!-- Left blue arc (from top center to bottom center via left) -->
    <path d="M 800 180 A 680 300 0 0 0 800 780" fill="none"
          stroke="url(#ovalLeft)" stroke-width="48" stroke-linecap="round"/>
    <!-- Right red arc (from top center to bottom center via right) -->
    <path d="M 800 180 A 680 300 0 0 1 800 780" fill="none"
          stroke="url(#ovalRight)" stroke-width="48" stroke-linecap="round"/>

    <!-- Inner white thin oval separator -->
    <ellipse cx="800" cy="480" rx="660" ry="280" fill="none"
             stroke="#FFFFFF" stroke-width="3" opacity="0.85"/>

    <!-- Top chrome shine on left half (soft) -->
    <path d="M 800 180 A 680 300 0 0 0 800 780" fill="none"
          stroke="url(#ovalShine)" stroke-width="48"/>
  </g>

  <!-- WORDMARK: FR in blue (italic skew) -->
  <g filter="url(#softShadow)">
    <!-- Dark base layer for depth -->
    <text x="765" y="585" class="wm" text-anchor="end"
          transform="skewX(-10) translate(90,0)" fill="#001A3D" opacity="0.5">FR</text>
    <!-- Main blue gradient -->
    <text x="760" y="580" class="wm" text-anchor="end"
          transform="skewX(-10) translate(90,0)" fill="url(#letterBlue)">FR</text>
    <!-- Shine overlay -->
    <rect x="200" y="280" width="700" height="140" fill="url(#letterShine)" clip-path="url(#clipLeftLetters)"/>
    <!-- Dark crisp stroke -->
    <text x="760" y="580" class="wm" text-anchor="end"
          transform="skewX(-10) translate(90,0)" fill="none"
          stroke="#001A3D" stroke-width="3">FR</text>
  </g>

  <!-- THERMOMETER replacing "I" at center: blue cold bottom, red hot top -->
  <g transform="translate(772, 280)" filter="url(#softShadow)">
    <!-- Glass tube background -->
    <rect x="0" y="0" width="56" height="260" rx="28" ry="28"
          fill="#FFFFFF" stroke="#001A3D" stroke-width="7"/>
    <!-- COLD mercury (blue, bottom half) -->
    <rect x="10" y="140" width="36" height="118" fill="url(#mercuryCold)"/>
    <!-- HOT mercury (red, top half with rounded top) -->
    <path d="M 10 60
             L 46 60
             L 46 140
             L 10 140 Z" fill="url(#mercuryHot)"/>
    <path d="M 10 60
             Q 10 46 18 42
             Q 28 36 38 42
             Q 46 46 46 60 Z" fill="url(#mercuryHot)"/>
    <!-- Divider at mid -->
    <line x1="0" y1="140" x2="56" y2="140" stroke="#001A3D" stroke-width="4"/>
    <!-- Glass highlight (left side) -->
    <rect x="7" y="20" width="7" height="220" rx="3.5" fill="#FFFFFF" opacity="0.7"/>
    <!-- Graduation ticks on right -->
    <g stroke="#001A3D" stroke-width="4" stroke-linecap="round">
      <line x1="46" y1="55" x2="62" y2="55"/>
      <line x1="46" y1="90" x2="54" y2="90"/>
      <line x1="46" y1="125" x2="62" y2="125"/>
      <line x1="46" y1="160" x2="54" y2="160"/>
      <line x1="46" y1="195" x2="62" y2="195"/>
      <line x1="46" y1="230" x2="54" y2="230"/>
    </g>
    <!-- Bulb (blue, cold reservoir) -->
    <circle cx="28" cy="290" r="56" fill="url(#bulbBlue)" stroke="#001A3D" stroke-width="7"/>
    <!-- Bulb highlight -->
    <ellipse cx="12" cy="270" rx="13" ry="20" fill="#FFFFFF" opacity="0.55"/>
    <!-- Top cap -->
    <circle cx="28" cy="4" r="9" fill="#001A3D"/>
  </g>

  <!-- WORDMARK: MEZ in red (italic skew) -->
  <g filter="url(#softShadow)">
    <!-- Dark base layer for depth -->
    <text x="865" y="585" class="wm"
          transform="skewX(-10) translate(90,0)" fill="#4A0708" opacity="0.5">MEZ</text>
    <!-- Main red gradient -->
    <text x="860" y="580" class="wm"
          transform="skewX(-10) translate(90,0)" fill="url(#letterRed)">MEZ</text>
    <!-- Shine overlay -->
    <rect x="860" y="280" width="700" height="140" fill="url(#letterShine)" clip-path="url(#clipRightLetters)"/>
    <!-- Dark crisp stroke -->
    <text x="860" y="580" class="wm"
          transform="skewX(-10) translate(90,0)" fill="none"
          stroke="#4A0708" stroke-width="3">MEZ</text>
  </g>
</svg>
